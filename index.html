<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atlas Voyages – Explorer le monde</title>

    <!-- Police Google Fonts : Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Si tu utilises un framework CSS (Bootstrap, Tailwind…), ajoute son lien ICI, AVANT style.css -->
    <link rel="stylesheet" href="style.css" />

    <!-- defer : le script s'exécute une fois le HTML chargé -->
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="px-[5%] py-5 bg-[#0F4C81] text-white">
        <h3>Atlas Voyages</h3>
    </header>
    <main class="px-[5%] py-10">
      <section>
        <h1 class="text-3xl font-bold my-2">Explorer le monde</h1>
        <p class="mt-1 text-sm text-[#5B6576]">Choisis un continent, parcours les pays et trouve ta prochaine destination.</p>
      </section>
      <section class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm">

            <div class="flex flex-col items-center gap-4 md:flex-row">

                <div class="w-full md:w-50">
                    <label for="continent" class="mb-1 block text-xs font-semibold">
                        Continent
                    </label>
                    <select id="continent" class="h-[38px] w-full rounded-md border border-[#D9E0E8] bg-white px-3 text-sm ">
                        <option value="Afrique">Afrique</option>
                        <option value="Asie">Asie</option>
                        <option value="Europe">Europe</option>
                        <option value="Amerique">Amérique</option>
                        <option value="Oceanie">Océanie</option>
                    </select>
                </div>
                <div class="w-full md:w-50">
                  <label for="search" class="mb-1 block text-xs ">
                      Rechercher un pays
                  </label>
                  <input type="text" id="search" placeholder="Ex. : Morocco" class="h-[38px] w-full rounded-md border border-[#D9E0E8] pl-9 pr-3 text-sm">
                </div>
                <div class="w-full md:w-50"> 
                  <button class="bg-#0F4C81 text-white bg-[#0F4C81] text-[10px] rounded-md px-5 mt-3 py-3">
                    Trier par population
                  </button>
                </div>
            </div>
        </section>
        <section class="my-[5%]">
          <div id="articles" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3">
            <!-- <article class="w-full max-w-sm bg-white border border-[#D9E0E8] rounded-lg overflow-hidden">
                    <img src="Drapeau_img.png" alt="Drapeau du Maroc" class="w-full h-48 object-cover bg-[#E5EBF3]">

                    <div class="p-5 leading-8">
                        <p class="text-2xl font-semibold text-slate-900 mb-2">Morocco</p>

                        <div class="flex justify-between">
                            <span class="text-slate-500">Capitale</span>
                            <span class="font-medium text-slate-900">Rabat</span>
                        </div>

                        <div class="flex justify-between">
                            <span class="text-slate-500">Population</span>
                            <span class="font-medium text-slate-900">37 457 971</span>
                        </div>
                    </div>
                </article> -->
          </div>
        </section>
    </main>


    <script src="script.js"></script>
  </body>
</html>
